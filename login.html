<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="login-box">
        <img id="logo-image" src="photos/logo.png" alt="">
        <h1 class="login-title">تسجيل دخول الإدارة</h1>


        <form id="login-form">
            <input type="email" id="admin-email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="admin-password" placeholder="كلمة المرور" required>
            <button type="submit" class="login-btn">دخول</button>
        </form>

        <p id="login-error" class="login-error"></p>
    </section>
<script src="main.js"></script>
</body>
</html>
